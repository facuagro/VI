<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas 🌻</title>
    <style>
        :root {
            --amarillo-sol: #ffd700;
            --brillo-oro: #ffae00;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            touch-action: none;
        }

        /* Contenedor de estrellas */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .estrella {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Interfaz principal */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .vibrant-text h1 {
            color: var(--amarillo-sol);
            font-size: 2.2rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--brillo-oro), 0 0 20px var(--brillo-oro);
            animation: pulse-glow 2s infinite alternate;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .vibrant-text p {
            color: #fff9c4;
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 10px var(--brillo-oro), 0 0 20px var(--brillo-oro); }
            to { text-shadow: 0 0 20px var(--brillo-oro), 0 0 35px #ffee58, 0 0 15px #fff; }
        }

        #start-btn {
            padding: 18px 36px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #fdd835, #f9a825);
            color: #3e2723;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(253, 216, 53, 0.7);
            z-index: 100;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(253, 216, 53, 0.4);
        }

        /* Ilustración de Girasoles en movimiento */
        .girasol-svg {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 0 10px var(--brillo-oro));
            animation: galaxy-float 7s linear forwards;
        }

        @keyframes galaxy-float {
            0% {
                transform: translate(0, 110vh) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate(calc(var(--side-move) * 2), -20vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="starsBox"></div>

    <div id="ui" class="content">
        <button id="start-btn">
            <svg width="24" height="24" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="15" fill="#5D4037"/>
                <g fill="#FFD700">
                    <ellipse cx="50" cy="15" rx="6" ry="15"/>
                    <ellipse cx="50" cy="85" rx="6" ry="15"/>
                    <ellipse cx="15" cy="50" rx="15" ry="6"/>
                    <ellipse cx="85" cy="50" rx="15" ry="6"/>
                </g>
            </svg>
            Abrir Regalo Galáctico
        </button>
        
        <div id="mensaje" class="vibrant-text hidden">
            <h1>¡Feliz día de las flores amarillas!</h1>
            <p>Amarillas como el sol,<br>ya que tú iluminas mi día. ✨</p>
        </div>
    </div>

    <!-- Canción de fondo -->
    <audio id="musicaFlor" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const starsBox = document.getElementById('starsBox');
        const btn = document.getElementById('start-btn');
        const mensaje = document.getElementById('mensaje');
        const audio = document.getElementById('musicaFlor');

        // Generar estrellas de fondo
        function initStars() {
            for (let i = 0; i < 90; i++) {
                const estrella = document.createElement('div');
                estrella.className = 'estrella';
                const tamaño = (Math.random() * 3 + 1) + 'px';
                estrella.style.width = tamaño;
                estrella.style.height = tamaño;
                estrella.style.left = Math.random() * 100 + 'vw';
                estrella.style.top = Math.random() * 100 + 'vh';
                estrella.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                starsBox.appendChild(estrella);
            }
        }

        initStars();

        btn.addEventListener('click', () => {
            btn.classList.add('hidden');
            mensaje.classList.remove('hidden');

            // Reproducción para iOS Safari
            audio.play().catch(error => console.log("Audio de iPhone bloqueado:", error));

            // Lluvia constante de girasoles
            setInterval(spawnSunflower, 300);
        });

        // Crear vector visual del Girasol
        function spawnSunflower() {
            const container = document.createElement('div');
            container.className = 'girasol-svg';
            
            // SVG estilizado con pétalos y centro oscuro
            const size = Math.random() * 30 + 40;
            container.innerHTML = `
                <svg width="${size}" height="${size}" viewBox="0 0 100 100">
                    <g fill="#FFD700">
                        <ellipse cx="50" cy="12" rx="7" ry="18"/>
                        <ellipse cx="50" cy="88" rx="7" ry="18"/>
                        <ellipse cx="12" cy="50" rx="18" ry="7"/>
                        <ellipse cx="88" cy="50" rx="18" ry="7"/>
                        <ellipse cx="23" cy="23" rx="8" ry="18" transform="rotate(-45 23 23)"/>
                        <ellipse cx="77" cy="77" rx="8" ry="18" transform="rotate(-45 77 77)"/>
                        <ellipse cx="77" cy="23" rx="8" ry="18" transform="rotate(45 77 23)"/>
                        <ellipse cx="23" cy="77" rx="8" ry="18" transform="rotate(45 23 77)"/>
                    </g>
                    <circle cx="50" cy="50" r="22" fill="#3E2723"/>
                    <circle cx="50" cy="50" r="18" fill="#4E342E"/>
                </svg>
            `;

            container.style.left = Math.random() * 90 + 'vw';
            container.style.setProperty('--side-move', (Math.random() * 120 - 60) + 'px');

            document.body.appendChild(container);

            setTimeout(() => {
                container.remove();
            }, 7000);
        }
    </script>
</body>
</html>
